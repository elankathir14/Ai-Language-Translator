<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#grad1)" filter="url(#glow)" opacity="0.3"/>
  <rect x="10" y="10" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#grad1)" stroke-width="2.5"/>

  <!-- Left Letter 'A' (English/Latin) -->
  <path d="M 28 65 L 38 33 L 48 65 M 31 55 L 45 55" 
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Translation Synapse Curve -->
  <path d="M 46 42 C 54 35, 60 38, 64 45" 
        stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="2 3"/>
  <path d="M 62 58 C 55 64, 48 62, 44 55" 
        stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="2 3"/>
  
  <!-- Right Character '文' / Asian ideograph representation -->
  <path d="M 57 37 L 77 37 M 67 33 L 67 43 M 59 47 L 75 65 M 73 48 L 59 65" 
        stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- AI Pulse Nodes -->
  <circle cx="50" cy="50" r="3" fill="#a855f7" />
  <circle cx="28" cy="65" r="2" fill="#6366f1" />
  <circle cx="77" cy="37" r="2" fill="#38bdf8" />
</svg>
